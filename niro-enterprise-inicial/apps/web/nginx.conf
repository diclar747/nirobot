server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 110m;
  absolute_redirect off;

  # Compresión en origen (Cloudflare ya comprime niro.com.py, pero no todos los dominios pasan por ahí).
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

  location /api {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://api:4000/health;
  }

  # Sistema de Facebook/Instagram (autopost, CRM propio): vive bajo esta ruta del
  # mismo sitio, sin subdominio propio. server.mjs le quita el prefijo solo
  # (NIRO_BASE_PATH=/facebook); acá se pasa la ruta completa, sin reescribir.
  # Con barra final: sin ella también atraparía /facebook-instagram (la página de Niro que lo embebe).
  location = /facebook {
    return 301 /facebook/;
  }
  location /facebook/ {
    # Cada pedido pasa por Niro: sesión viva + organización habilitada + prueba/plan al día.
    auth_request /_facebook_authz;
    error_page 401 403 = @facebook_denied;
    # Cada organización tiene su propio panel (su propio Facebook): Niro dice cuál y se pisa lo que mande el navegador.
    auth_request_set $niro_fb_org $upstream_http_x_niro_org;
    proxy_set_header X-Niro-Org $niro_fb_org;
    proxy_pass http://facebook:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Traefik termina el TLS y llega acá por HTTP plano: $scheme siempre daría "http". Se reenvía
    # tal cual el X-Forwarded-Proto que ya puso Traefik (siempre lo manda en sus routers HTTPS).
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # SSE (/facebook/api/stream): sin buffer y con lectura larga, igual que /socket.io.
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 110m;
  }

  location = /_facebook_authz {
    internal;
    proxy_pass http://api:4000/api/facebook/authz;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  # Sin acceso: JSON con login:true (el panel lo trata como sesión vencida y Niro la renueva y lo reabre).
  location @facebook_denied {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"ok":false,"login":true,"error":"Tu sesión de Niro venció o no tenés acceso a Facebook / Instagram."}';
  }

  location /socket.io/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sitemap.xml {
    include /etc/nginx/snippets/security-headers.conf;
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location = /robots.txt {
    include /etc/nginx/snippets/security-headers.conf;
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Pantallas privadas de la app: no deben indexarse.
  location ~ ^/(dashboard|home|inbox|board|contactos|grupos|historial|orders|campaigns|llamadas|estados|sms|sms-admin|gestion|reports|bot|ai-agents|users|departments|settings|desarrolladores|organizations|clientes|planes|billing|change-password|facebook-instagram)(/|$) {
    include /etc/nginx/snippets/security-headers.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
