<svg
        width="512"
        height="512"
        viewBox="0 0 200 200"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        
      ><rect width="200" height="200" fill="#0b1329"/>
        <defs>
          <linearGradient id="bodyGrad" x1="50" y1="20" x2="150" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="60%" stop-color="#e2e8f0" />
            <stop offset="100%" stop-color="#94a3b8" />
          </linearGradient>

          <linearGradient id="visorGrad" x1="60" y1="50" x2="140" y2="100" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0b1329" />
            <stop offset="50%" stop-color="#0f172a" />
            <stop offset="100%" stop-color="#1e293b" />
          </linearGradient>

          <linearGradient id="glowCyan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
          </linearGradient>

          <linearGradient id="chestGrad" x1="70" y1="130" x2="130" y2="180" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="100%" stop-color="#1d4ed8" />
          </linearGradient>

          <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>

          <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>

        
        <circle cx="100" cy="100" r="75" fill="#38bdf8" opacity="0.18" filter="url(#outerGlow)" />

        
        
        <ellipse cx="44" cy="78" rx="14" ry="20" fill="url(#bodyGrad)" />
        <ellipse cx="44" cy="78" rx="8" ry="14" fill="#0f172a" />
        <ellipse cx="44" cy="78" rx="5" ry="10" fill="#38bdf8" filter="url(#glowEffect)" opacity="0.9" />

        
        <ellipse cx="156" cy="78" rx="14" ry="20" fill="url(#bodyGrad)" />
        <ellipse cx="156" cy="78" rx="8" ry="14" fill="#0f172a" />
        <ellipse cx="156" cy="78" rx="5" ry="10" fill="#38bdf8" filter="url(#glowEffect)" opacity="0.9" />

        
        <path d="M100 42 V22" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
        <circle cx="100" cy="18" r="9" fill="url(#glowCyan)" filter="url(#glowEffect)" />
        <circle cx="98" cy="15" r="3" fill="#ffffff" opacity="0.8" />

        
        <rect x="52" y="38" width="96" height="82" rx="42" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1.5" />
        
        
        <rect x="62" y="52" width="76" height="54" rx="27" fill="url(#visorGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />

        
        <path d="M72 60 C80 56 120 56 128 60 C120 62 80 62 72 60 Z" fill="#ffffff" opacity="0.25" />

        
        <path
          d="M76 77 C76 72 84 72 88 77"
          stroke="#38bdf8"
          stroke-width="4"
          stroke-linecap="round"
          filter="url(#glowEffect)"
        />
        <circle cx="82" cy="81" r="2" fill="#38bdf8" filter="url(#glowEffect)" />

        <path
          d="M112 77 C112 72 120 72 124 77"
          stroke="#38bdf8"
          stroke-width="4"
          stroke-linecap="round"
          filter="url(#glowEffect)"
        />
        <circle cx="118" cy="81" r="2" fill="#38bdf8" filter="url(#glowEffect)" />

        
        <ellipse cx="72" cy="88" rx="4" ry="2.5" fill="#06b6d4" opacity="0.4" filter="url(#glowEffect)" />
        <ellipse cx="128" cy="88" rx="4" ry="2.5" fill="#06b6d4" opacity="0.4" filter="url(#glowEffect)" />

        
        <path
          d="M68 122 C68 118 78 116 100 116 C122 116 132 118 132 122 L142 168 C142 176 130 182 100 182 C70 182 58 176 58 168 Z"
          fill="url(#bodyGrad)"
          stroke="#cbd5e1"
          stroke-width="1.5"
        />

        
        <circle cx="58" cy="136" r="12" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1" />
        <circle cx="142" cy="136" r="12" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="1" />

        
        <rect x="80" y="132" width="40" height="38" rx="12" fill="url(#chestGrad)" stroke="rgba(56, 189, 248, 0.6)" stroke-width="1.5" filter="url(#glowEffect)" />
        <path
          d="M93 158 V144 L107 158 V144"
          stroke="#ffffff"
          stroke-width="3.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>