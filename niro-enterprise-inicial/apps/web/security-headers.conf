# Cabeceras de seguridad para las páginas y archivos de la web (se incluyen en cada location estática:
# en nginx un add_header dentro de un location anula los heredados). La API ya manda las suyas (helmet)
# y el panel de Facebook las propias, por eso no se incluyen en /api ni en /facebook/.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(), payment=(), usb=()" always;
