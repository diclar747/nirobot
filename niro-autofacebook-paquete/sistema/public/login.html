<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Niro — Ingresar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="__NIRO_BASE__/styles.css?v=0.5.4" />
    <style>
      .login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--hero); }
      .login-card { width: min(380px, 100%); padding: 28px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow-lg); }
      .login-card .logo { margin-bottom: 18px; }
      .login-card h1 { font-size: 24px; letter-spacing: -.04em; }
      .login-card p { margin: 6px 0 18px; color: var(--muted); font-size: 13.5px; }
      .login-card input { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); outline: none; }
      .login-card input:focus { border-color: var(--violet); box-shadow: 0 0 0 3px var(--violet-glow); }
      .login-card .btn { width: 100%; margin-top: 12px; min-height: 44px; }
      .login-error { min-height: 20px; margin-top: 10px; color: var(--red); font-size: 13px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main class="login">
      <form class="login-card" id="login-form">
        <span class="logo">N</span>
        <h1>Ingresar a Niro</h1>
        <p>Tu centro de Facebook y Messenger.</p>
        <label class="sr-only" for="password">Contraseña</label>
        <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña del panel" required autofocus />
        <button class="btn primary" type="submit">Ingresar</button>
        <div id="login-error" class="login-error" role="alert"></div>
      </form>
    </main>
    <script>
      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("login-error");
        error.textContent = "";
        try {
          const response = await fetch("__NIRO_BASE__/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: document.getElementById("password").value }) });
          const payload = await response.json();
          if (!response.ok || !payload.ok) throw new Error(payload.error || "No se pudo ingresar.");
          location.href = "__NIRO_BASE__/";
        } catch (reason) {
          error.textContent = reason.message;
        }
      });
    </script>
  </body>
</html>
